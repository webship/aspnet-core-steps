name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cucumber:
    # Four apps, each made with `dotnet new` in a DDEV project on the runner, published and run in production by the
    # web container, with the .NET SDK copied from its official image:
    #   - webapp: the Razor Pages app with the default account pages on the current .NET release (11.0), with the
    #     additions of the build (tests/features), then the assertions that must fail (tests/must-fail), then the
    #     same app in the Development environment (tests/development);
    #   - webapp-lts: the same app on the long-term-support release (10.0);
    #   - blazor, blazor-lts: the Blazor Web App, whose account pages are components of its own (tests/blazor), on
    #     both releases.
    name: aspnet-core-steps test suite (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: webapp
            template: webapp
            dotnet: '11.0'
            features: tests/features
            account_path: /Identity/Account
            protected_path: /Movies
            must_fail: true
            development: true
          - lane: webapp-lts
            template: webapp
            dotnet: '10.0'
            features: tests/features
            account_path: /Identity/Account
            protected_path: /Movies
            must_fail: false
            development: false
          - lane: blazor
            template: blazor
            dotnet: '11.0'
            features: tests/blazor
            account_path: /Account
            protected_path: /auth
            must_fail: false
            development: false
          - lane: blazor-lts
            template: blazor
            dotnet: '10.0'
            features: tests/blazor
            account_path: /Account
            protected_path: /auth
            must_fail: false
            development: false
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      SITE_DIR: ${{ github.workspace }}/../aspnet-core-site
      TEMPLATE: ${{ matrix.template }}
      DOTNET_VERSION: ${{ matrix.dotnet }}
      FEATURES: ${{ matrix.features }}
      ACCOUNT_PATH: ${{ matrix.account_path }}
      PROTECTED_PATH: ${{ matrix.protected_path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      # NuGet keeps the app's packages in the project (.nuget/); a build in the same folder reuses them.
      - name: Restore the NuGet downloads of an earlier run
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../aspnet-core-site/.nuget
          key: nuget-${{ matrix.lane }}-${{ hashFiles('.github/scripts/build-ddev-site.sh', 'site/prepare-app.py') }}
          restore-keys: |
            nuget-${{ matrix.lane }}-

      - name: Build the test site (the app, the additions of the build, the accounts)
        run: .github/scripts/build-ddev-site.sh

      - name: Check the site is the one cucumber.js runs against by default
        run: |
          DEFAULT_URL="$(LAUNCH_URL= node -e "console.log(require('./cucumber.js').default.worldParameters.launchUrl)")"
          echo "Built: $LAUNCH_URL, default: $DEFAULT_URL"
          test "${LAUNCH_URL%/}" = "$DEFAULT_URL"

      - name: Run the test suite
        run: npx cucumber-js

      - name: Run the test suite again (it leaves the site as it found it)
        run: npx cucumber-js

      - name: Run the assertions that must fail
        if: matrix.must_fail
        env:
          FEATURES: ''
        run: npm run test:must-fail

      - name: Run the app in the Development environment, and its features
        if: matrix.development
        run: |
          APP_ENVIRONMENT=Development ENVIRONMENT_ONLY=1 .github/scripts/build-ddev-site.sh
          FEATURES=tests/development npx cucumber-js
          FEATURES='' MUST_FAIL_DIR=tests/development npm run test:must-fail

      - name: Show the log of the app
        if: failure()
        run: |
          cd "$SITE_DIR"
          ddev logs --tail 200 < /dev/null || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.lane }}
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.lane }}
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
